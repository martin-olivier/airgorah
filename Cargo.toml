[workspace]
resolver = "3"
members = ["crates/common", "crates/agent", "crates/gui"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
authors = ["Martin Olivier <martin.olivier@live.fr>"]
homepage = "https://github.com/martin-olivier/airgorah"
repository = "https://github.com/martin-olivier/airgorah"
documentation = "https://github.com/martin-olivier/airgorah/wiki"
readme = "README.md"

[workspace.dependencies]
airgorah-common = { path = "crates/common", version = "0.8.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
nix = { version = "0.31", features = ["signal", "socket", "user", "fs"] }
which = "8"
lazy_static = "1"
